version: '2'
sql:
  - engine: postgresql
    schema: '../../db/migrations'
    queries: 'internal/modules/cadastro/queries'
    gen:
      go:
        package: gen
        out: internal/modules/cadastro/gen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type:
              import: nexoisp/api-go/internal/jsonx
              type: NumericText
          - db_type: uuid
            go_type:
              import: nexoisp/api-go/internal/jsonx
              type: UUID
  - engine: postgresql
    schema: '../../db/migrations'
    queries: 'internal/modules/leitura/queries'
    gen:
      go:
        package: gen
        out: internal/modules/leitura/gen
        sql_package: pgx/v5
        emit_exported_queries: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type:
              import: nexoisp/api-go/internal/jsonx
              type: NumericText
          - db_type: uuid
            go_type:
              import: nexoisp/api-go/internal/jsonx
              type: UUID
