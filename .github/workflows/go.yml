name: migração Go — contrato e coexistência
on:
  push:
  pull_request:
jobs:
  contrato:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: apps/api-go/go.sum
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: python3 scripts/migracao-go/migrations.py && python3 scripts/migracao-go/verificar_deriva.py
      - name: Código gerado reproduzível
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          cd apps/api-go
          sqlc generate
          git diff --exit-code -- internal/modules/cadastro/gen internal/modules/leitura/gen
      - name: SQL e templates revisados
        run: |
          node scripts/migracao-go/extrair_consultas.cjs --check
          node scripts/migracao-go/extrair_grupos.cjs --check
          node scripts/migracao-go/extrair_aviso.cjs --check
          node scripts/migracao-go/extrair_dinamicas.cjs --check
          node scripts/migracao-go/extrair_radius_templates.cjs --check
          node scripts/migracao-go/extrair_escritas.cjs --check
          node scripts/migracao-go/extrair_identity.cjs --check
          node scripts/migracao-go/extrair_motor.cjs --check
          node scripts/migracao-go/extrair_financeiro.cjs --check
          node scripts/migracao-go/extrair_rotinas.cjs --check
          node scripts/migracao-go/extrair_agentes.cjs --check
          node scripts/migracao-go/extrair_radius.cjs --check
          python3 scripts/migracao-go/proxy.py --check
          python3 scripts/migracao-go/proxy.py --table infra/prod/caddy/rotas.go.yaml --output infra/prod/caddy/Caddyfile.go --fallback go --check
      - name: Lint e limites de acesso ao banco
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: apps/api-go
      - run: ./nexo contrato up
      - run: ./nexo contrato migrations
      - run: ./nexo contrato run --rotas fase1
      - run: ./nexo contrato mutacoes
      - run: ./nexo contrato escopo_pop
      - run: ./nexo contrato leituras
      - run: ./nexo contrato consultas
      - run: ./nexo contrato grupos
      - run: ./nexo contrato dinamicas
      - run: ./nexo contrato aviso
      - run: ./nexo contrato proxy
      - run: ./nexo contrato regressoes
      - run: ./nexo contrato e2e
      - run: ./nexo contrato consolidacao
      - run: docker build -q -t nexoisp-agent services/network-agent
      - run: ./nexo contrato agente_go
      - run: ./nexo contrato mtls_go
      - run: ./nexo contrato jobs-up
      - run: ./nexo contrato river_radius
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrato-go-fase1
          path: tests/contrato/relatorios/
      - run: ./nexo contrato down
        if: always()
