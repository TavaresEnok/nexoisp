name: backend Go e painel
on:
  push:
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - name: Build, análise e testes Go
        working-directory: apps/api-go
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.14.0, working-directory: apps/api-go}
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc, cache: npm}
      - name: Frontend preservado
        run: |
          npm ci
          npm -w apps/web run format:check
          npm -w apps/web run typecheck
          npm -w apps/web test
          npm -w apps/web run build
      - name: Instalação, administração, financeiro e outbox com duas réplicas Go
        run: python3 tests/contrato/nativo.py
      - name: Migração 64 para 65 e vínculos financeiros pendentes
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/financial_connections_migration.py
      - name: Migração 65 para 66 e movimentos financeiros históricos
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/financial_movements_migration.py
      - name: Migração 66 para 67 sem reativacoes retroativas
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/payment_effects_migration.py
      - name: Provider issuance migration and logical recovery
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/provider_issuance_migration.py
      - name: Reserva de emissao, vinculo e recuperacao da migracao 69
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/provider_issuance_reservation_migration.py
      - name: Recebimento independente de falha tecnica e retomada
        env: {NEXO_PAYMENT_LAB: '1'}
        run: python3 tests/contrato/payment_effects.py
      - name: Isolamento, RLS, locks e reinício Go com PostgreSQL descartável
        run: python3 tests/contrato/go_integration.py
      - name: Falha por provedor, filas, limites compartilhados e recuperação
        run: python3 tests/contrato/resilience.py
      - name: Ferramentas de operação e conferência de migração
        run: python3 -m unittest discover -s tests/operacao
      - name: Integridade de cadastro, campos personalizados, equipe e estoque
        run: python3 tests/contrato/sgp_auditoria.py
      - name: Painel real contra Go
        run: python3 tests/contrato/e2e.py
      - name: Imagem da VPN Go
        run: |
          docker build -f apps/api-go/Dockerfile -t nexo-api-go:final .
          docker build -f apps/api-go/Dockerfile.vpn -t nexo-vpn-go:final .
          python3 tests/contrato/vpn_go.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-v0-evidencias, path: docs/integracao-v0/evidencias/}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: verificacao-go, path: tests/contrato/relatorios/}
      - name: Limpeza do laboratório
        if: always()
        run: docker rm -f nexo-fase1-db nexo-resilience-db || true
  agente:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r services/network-agent/requirements.txt && pip check
      - working-directory: services/network-agent
        run: python -m unittest discover -s tests -t .
