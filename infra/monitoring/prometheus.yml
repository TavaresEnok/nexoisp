global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: nexoisp
    static_configs:
      - targets: ['api:9090']
# Configure alerting.alertmanagers and the receiver on the monitoring host.
# Keep 9090 private; use a VPN/private route when Prometheus is on another host.
