# Consultas do RADIUS integrado do NexoISP.
# Atualização e fim de sessão casam pelo identificador único OU por (usuário, sessão) ainda aberta: o identificador único depende do
# endereço do concentrador, que muda quando ele passa do acesso direto para o túnel; sem isso a sessão antiga ficaria aberta para sempre. Tudo é restrito ao provedor do concentrador que enviou o pacote
# (%{client:shortname} = tenant_id, vindo de radius_nas). O pacote do localhost (teste interno) não casa com provedor nenhum.
sql_user_name = "%{User-Name}"
event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"
tenant = "NULLIF('%{client:shortname}', 'localhost')::uuid"

# A senha sai cifrada do banco e só é aberta aqui, com a chave que só este servidor conhece.
authorize_check_query = "\
	SELECT 0 AS id, a.username, 'Cleartext-Password' AS attribute, pgp_sym_decrypt(a.secret_enc, '$ENV{NEXO_RADIUS_KEY}') AS value, ':=' AS op \
	FROM radius_account a WHERE a.tenant_id = ${tenant} AND a.username = '%{SQL-User-Name}' \
	UNION ALL \
	SELECT c.id, c.username, c.attribute, c.value, c.op \
	FROM radius_check c WHERE c.tenant_id = ${tenant} AND c.username = '%{SQL-User-Name}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius_reply WHERE tenant_id = ${tenant} AND username = '%{SQL-User-Name}' \
	ORDER BY id"

simul_count_query = "\
	SELECT COUNT(*) FROM radius_acct \
	WHERE tenant_id = ${tenant} AND username = '%{SQL-User-Name}' AND stopped_at IS NULL"

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"
	type {
		accounting-on {
			query = "\
				UPDATE radius_acct SET stopped_at = ${....event_timestamp}, updated_at = ${....event_timestamp}, \
					session_seconds = GREATEST(0, (${....event_timestamp_epoch} - EXTRACT(EPOCH FROM started_at))::bigint), \
					terminate_cause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE tenant_id = ${....tenant} AND stopped_at IS NULL AND nas_ip = '%{Packet-Src-IP-Address}' AND started_at <= ${....event_timestamp}"
		}
		accounting-off {
			query = "${..accounting-on.query}"
		}
		start {
			query = "\
				INSERT INTO radius_acct (tenant_id, unique_id, session_id, username, nas_ip, nas_port, started_at, updated_at, calling_station, called_station, framed_ip) \
				VALUES (${....tenant}, '%{Acct-Unique-Session-Id}', '%{Acct-Session-Id}', '%{SQL-User-Name}', '%{Packet-Src-IP-Address}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), ${....event_timestamp}, ${....event_timestamp}, \
					NULLIF('%{Calling-Station-Id}', ''), NULLIF('%{Called-Station-Id}', ''), NULLIF('%{Framed-IP-Address}', '')) \
				ON CONFLICT (unique_id) DO UPDATE SET started_at = EXCLUDED.started_at, updated_at = EXCLUDED.updated_at, framed_ip = EXCLUDED.framed_ip, stopped_at = NULL"
		}
		interim-update {
			query = "\
				UPDATE radius_acct SET updated_at = ${....event_timestamp}, session_seconds = %{%{Acct-Session-Time}:-0}, \
					bytes_in = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
					bytes_out = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
					framed_ip = COALESCE(NULLIF('%{Framed-IP-Address}', ''), framed_ip) \
				WHERE tenant_id = ${....tenant} AND (unique_id = '%{Acct-Unique-Session-Id}' \
					OR (username = '%{SQL-User-Name}' AND session_id = '%{Acct-Session-Id}' AND stopped_at IS NULL))"
			query = "\
				INSERT INTO radius_acct (tenant_id, unique_id, session_id, username, nas_ip, nas_port, started_at, updated_at, session_seconds, bytes_in, bytes_out, calling_station, called_station, framed_ip) \
				VALUES (${....tenant}, '%{Acct-Unique-Session-Id}', '%{Acct-Session-Id}', '%{SQL-User-Name}', '%{Packet-Src-IP-Address}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), ${....event_timestamp}, %{%{Acct-Session-Time}:-0}, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
					NULLIF('%{Calling-Station-Id}', ''), NULLIF('%{Called-Station-Id}', ''), NULLIF('%{Framed-IP-Address}', '')) \
				ON CONFLICT (unique_id) DO NOTHING"
		}
		stop {
			query = "\
				UPDATE radius_acct SET stopped_at = ${....event_timestamp}, updated_at = ${....event_timestamp}, session_seconds = %{%{Acct-Session-Time}:-0}, \
					bytes_in = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
					bytes_out = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
					terminate_cause = NULLIF('%{Acct-Terminate-Cause}', ''), framed_ip = COALESCE(NULLIF('%{Framed-IP-Address}', ''), framed_ip) \
				WHERE tenant_id = ${....tenant} AND (unique_id = '%{Acct-Unique-Session-Id}' \
					OR (username = '%{SQL-User-Name}' AND session_id = '%{Acct-Session-Id}' AND stopped_at IS NULL))"
			query = "\
				INSERT INTO radius_acct (tenant_id, unique_id, session_id, username, nas_ip, nas_port, started_at, updated_at, stopped_at, session_seconds, bytes_in, bytes_out, calling_station, called_station, framed_ip, terminate_cause) \
				VALUES (${....tenant}, '%{Acct-Unique-Session-Id}', '%{Acct-Session-Id}', '%{SQL-User-Name}', '%{Packet-Src-IP-Address}', \
					NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
					TO_TIMESTAMP(${....event_timestamp_epoch} - %{%{Acct-Session-Time}:-0}), ${....event_timestamp}, ${....event_timestamp}, %{%{Acct-Session-Time}:-0}, \
					(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
					(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
					NULLIF('%{Calling-Station-Id}', ''), NULLIF('%{Called-Station-Id}', ''), NULLIF('%{Framed-IP-Address}', ''), NULLIF('%{Acct-Terminate-Cause}', '')) \
				ON CONFLICT (unique_id) DO NOTHING"
		}
	}
}

post-auth {
	query = "\
		INSERT INTO radius_postauth (tenant_id, username, reply, calling_station, nas_ip) \
		SELECT ${..tenant}, '%{SQL-User-Name}', '%{reply:Packet-Type}', NULLIF('%{Calling-Station-Id}', ''), '%{Packet-Src-IP-Address}' \
		WHERE ${..tenant} IS NOT NULL"
}
