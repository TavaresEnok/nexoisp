# Concentradores não ficam neste arquivo: são cadastrados no painel e lidos do banco (sites-available/nexo-clients).
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{NEXO_RADIUS_KEY}
	shortname = localhost
}
client nexo_v4 {
	ipaddr = 0.0.0.0/0
	dynamic_clients = nexo_clients
	lifetime = 120
}
